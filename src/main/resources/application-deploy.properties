# --------------------------------------------------
# PERFIL DE DESPLIEGUE EN LA NUBE (Render + Supabase + Brevo)
# Activar con: spring.profiles.active=deploy
# --------------------------------------------------

# --------------------------------------------------
# CONEXIÓN A BASE DE DATOS (SUPABASE - POSTGRESQL)
# --------------------------------------------------

# URL JDBC oficial para PostgreSQL con SSL obligatorio (compatible con Connection Pooler IPv4)
spring.datasource.url=jdbc:postgresql://${DB_HOST_SUPABASE}:${DB_PORT_SUPABASE:5432}/${DB_DATABASE_SUPABASE:postgres}?sslmode=require

# Credenciales de conexión a Supabase
spring.datasource.username=${DB_USERNAME_SUPABASE}
spring.datasource.password=${DB_PASSWORD_SUPABASE}

# Driver de Java para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------
# CONFIGURACIÓN DE JPA / HIBERNATE
# ------------------------------------------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ------------------------------------------
# POOL DE CONEXIONES HIKARICP (SUPABASE POOLER)
# ------------------------------------------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.keepalive-time=60000

# Inicialización diferida de datos (activar a 'always' cuando data.sql contenga sentencias INSERT)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:data.sql

# --------------------------------------------------
# CONEXIÓN A SERVIDOR DE CORREOS (Brevo SMTP con TLS)
# --------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${BREVO_SMTP_USER}
spring.mail.password=${BREVO_SMTP_KEY}
app.mail.from=${MAIL_FROM:mands.notifications@gmail.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --------------------------------------------------
# OPTIMIZACIÓN DE RENDIMIENTO Y PLANTILLAS THYMELEAF
# --------------------------------------------------
spring.thymeleaf.cache=true

# Compresión HTTP (GZIP) para reducir tamaño de payloads HTML/JS/CSS
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Caché en navegador para recursos estáticos (7 días)
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

# --------------------------------------------------
# SEGURIDAD Y SUPRESIÓN DE ERRORES EN PRODUCCIÓN
# --------------------------------------------------
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.whitelabel.enabled=false