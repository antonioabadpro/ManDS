# --------------------------------------------------
# PERFIL DE DESPLIEGUE EN LA NUBE (Render + Supabase + Brevo)
# Activar con: spring.profiles.active=deploy
# --------------------------------------------------

# --------------------------------------------------
# CONEXIÓN A BASE DE DATOS (SUPABASE - POSTGRESQL)
# --------------------------------------------------

# URL JDBC oficial para PostgreSQL con SSL obligatorio (compatible con Connection Pooler IPv4)
spring.datasource.url=jdbc:postgresql://${DB_HOST_SUPABASE}:${DB_PORT_SUPABASE:5432}/${DB_DATABASE_SUPABASE:postgres}?sslmode=require

# Credenciales de conexión a Supabase
spring.datasource.username=${DB_USERNAME_SUPABASE}
spring.datasource.password=${DB_PASSWORD_SUPABASE}

# Driver de Java para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------
# CONFIGURACIÓN DE JPA / HIBERNATE
# ------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Inicialización diferida de datos (activar a 'always' cuando data.sql contenga sentencias INSERT)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# --------------------------------------------------
# CONEXIÓN A SERVIDOR DE CORREOS (Brevo SMTP con TLS)
# --------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000