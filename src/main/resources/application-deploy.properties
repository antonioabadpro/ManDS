# --------------------------------------------------
# PERFIL DE DESPLIEGUE EN LA NUBE (Render + Supabase + Brevo)
# Activar con: spring.profiles.active=deploy
# --------------------------------------------------

# --------------------------------------------------
# CONEXIÓN A BASE DE DATOS (SUPABASE - POSTGRESQL)
# --------------------------------------------------

# URL JDBC oficial para PostgreSQL con SSL obligatorio (compatible con Connection Pooler IPv4)
spring.datasource.url=jdbc:postgresql://${DB_HOST_SUPABASE}:${DB_PORT_SUPABASE:5432}/${DB_DATABASE_SUPABASE:postgres}?sslmode=require&prepareThreshold=5&preparedStatementCacheQueries=256&preparedStatementCacheSizeMiB=5&tcpKeepAlive=true&reWriteBatchedInserts=true

# Credenciales de conexión a Supabase
spring.datasource.username=${DB_USERNAME_SUPABASE}
spring.datasource.password=${DB_PASSWORD_SUPABASE}

# Driver de Java para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------
# CONFIGURACIÓN DE JPA / HIBERNATE
# ------------------------------------------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Optimización N+1: Batch Fetching y Batch Inserts/Updates
spring.jpa.properties.hibernate.default_batch_fetch_size=30
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ------------------------------------------
# POOL DE CONEXIONES HIKARICP (SUPABASE POOLER)
# ------------------------------------------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.keepalive-time=60000

# ------------------------------------------
# OPTIMIZACIÓN DEL SERVIDOR EMBEBIDO (TOMCAT)
# ------------------------------------------
# Restricción de hilos de trabajo para contenedores de 512 MB (ahorro de stack y CPU context-switching)
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=50
server.tomcat.max-connections=100

# Inicialización diferida de datos (activar a 'always' cuando data.sql contenga sentencias INSERT)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:data.sql

# Optimización de arranque en la nube: desactivar auditoría pesada y sincronización de secuencias innecesarias
app.seed.adjust-calendar-dates=false
app.db.sync-sequences=false

# --------------------------------------------------
# SERVICIO DE CORREO TRANSACCIONAL (Brevo REST API v3 sobre HTTPS 443)
# --------------------------------------------------
brevo.api.key=${BREVO_API_KEY}
app.mail.from=${MAIL_FROM:mands.notifications@gmail.com}

# --------------------------------------------------
# OPTIMIZACIÓN DE RENDIMIENTO Y PLANTILLAS THYMELEAF
# --------------------------------------------------
spring.thymeleaf.cache=true

# Compresión HTTP (GZIP) para reducir tamaño de payloads HTML/JS/CSS
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Caché en navegador para recursos estáticos (7 días)
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

# --------------------------------------------------
# SEGURIDAD Y SUPRESIÓN DE ERRORES EN PRODUCCIÓN
# --------------------------------------------------
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.whitelabel.enabled=false