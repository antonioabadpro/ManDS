# --------------------------------------------------
# CONEXIÓN A BASE DE DATOS (Docker - PostgreSQL)
# --------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST_DOCKER:localhost}:${DB_PORT_DOCKER:5432}/${DB_DATABASE_DOCKER:tfg_db}
spring.datasource.username=${DB_USERNAME_DOCKER}
spring.datasource.password=${DB_PASSWORD_DOCKER}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --------------------------------------------------
# CONEXIÓN A SERVIDOR DE CORREOS (Docker - Mailpit)
# --------------------------------------------------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false