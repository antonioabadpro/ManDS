# --------------------------------------------------
# CONEXIÓN A BASE DE DATOS
# --------------------------------------------------

# 'supabase' -> Utiliza Supabase
# 'h2' -> Utiliza H2
# 'docker' -> Utiliza Docker (PostgreSQL + Mailpit)
spring.profiles.active=h2

spring.application.name=erp
server.port=${PORT:8080}

# --------------------------------------------------
# CONFIGURACIÓN DE THYMELEAF
# --------------------------------------------------
spring.thymeleaf.cache=false

# --------------------------------------------------
# SEGURIDAD Y GESTIÓN DE SESIONES (JSESSIONID)
# --------------------------------------------------
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# --------------------------------------------------
# CONEXIÓN A SERVIDOR DE CORREOS (Mailpit / SMTP)
# --------------------------------------------------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# URL base de la aplicación para enlaces en correos
app_base_url=${APP_BASE_URL:http://localhost:8080}
