# --------------------------------------------------
# CONEXIÓN A BASE DE DATOS
# --------------------------------------------------

# 'deploy' -> Utiliza Despliegue en la nube (Render + Supabase + Brevo)
# 'h2' -> Utiliza H2
# 'docker' -> Utiliza Docker (PostgreSQL + Mailpit)
spring.profiles.active=deploy

spring.application.name=mands
server.port=${PORT:8080}

# --------------------------------------------------
# PERSISTENCIA JPA / HIBERNATE
# --------------------------------------------------
# Declaración explícita de OSIV para vistas SSR con Thymeleaf
spring.jpa.open-in-view=true

# --------------------------------------------------
# SEGURIDAD Y GESTIÓN DE SESIONES (JSESSIONID)
# --------------------------------------------------
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# --------------------------------------------------
# CONEXIÓN A SERVIDOR DE CORREOS (Mailpit / SMTP)
# --------------------------------------------------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# URL base de la aplicación para enlaces en correos
app_base_url=${APP_BASE_URL:http://localhost:8080}
# Soporte de cabeceras de proxy inverso (HTTPS en Render)
server.forward-headers-strategy=framework

# --------------------------------------------------
# CONFIGURACIÓN DE STRIPE API & WEBHOOKS (v33.4.2)
# --------------------------------------------------
stripe.public.key=${STRIPE_PUBLIC_KEY:pk_test_placeholder}
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
