<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Clases Prácticas - ManDS</title>

    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Prevención de FOUC para Tema Oscuro -->
    <script>
        if (localStorage.getItem('mands_theme') === 'dark' || (!('mands_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <link rel="stylesheet" href="../../static/css/styles.css" th:href="@{/css/styles.css}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../static/js/tailwind-config.js" th:src="@{/js/tailwind-config.js}"></script>

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="../../static/js/htmx-config.js" th:src="@{/js/htmx-config.js}"></script>

    <script src="../../static/js/layout.js" th:src="@{/js/layout.js}" defer></script>
    <script src="../../static/js/alumno.js" th:src="@{/js/alumno.js}" defer></script>
</head>

<body class="min-h-screen bg-slate-100 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-100 antialiased selection:bg-indigo-600 selection:text-white flex flex-col lg:flex-row overflow-x-hidden">

    <div id="sidebar-backdrop" class="fixed inset-0 z-40 bg-slate-950/60 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-none hidden lg:hidden" aria-hidden="true"></div>

    <aside th:replace="~{fragments/alumno-nav :: sidebar(activeSection='calendario')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-slate-50 dark:bg-slate-950 min-h-screen">

        <header th:replace="~{fragments/alumno-nav :: topbar(tituloSeccion='Reservar Clases Prácticas', subtituloSeccion='Agenda interactiva de tu profesor asignado y reserva de sesiones')}"></header>

        <main class="flex-1 p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl mx-auto w-full">

            <!-- Mensajes Flash y Alertas Dinámicas HTMX -->
            <div id="contenedor-alertas">

            </div>

            <!-- Banner de Control de Capacidad y Regla de Negocio 7.4 -->
            <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="space-y-1">
                    <div class="flex items-center space-x-2">
                        <h2 class="text-xl font-bold text-slate-900 dark:text-white">Agenda de Prácticas</h2>
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-indigo-100 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800" th:text="${profesor != null ? 'Prof. ' + profesor.nombre : 'Sin Profesor'}">
                            Prof. Asignado
                        </span>
                    </div>
                    <p th:replace="~{alumno/fragments/indicador-capacidad :: indicadorCapacidad(esOob=false)}"></p>
                </div>

                <!-- Enlace a Compra de Saldo o Nueva Matrícula -->
                <div class="flex items-center gap-3 shrink-0">
                    <th:block th:if="${matricula != null}">
                        <a th:href="@{/alumno/pagos}" class="inline-flex items-center space-x-2 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md transition transform active:scale-95">
                            <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                            </svg>
                            <span>Comprar Saldo</span>
                        </a>
                    </th:block>
                    <a th:if="${matricula == null}" th:href="@{/alumno/dashboard#seccion-nueva-matricula}" class="inline-flex items-center space-x-2 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-md transition transform active:scale-95">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        <span>Matricularme en un Permiso</span>
                    </a>
                </div>
            </div>

            <!-- Cabecera de Calendario con Leyenda de Estados Oficial -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 dark:text-white">Calendario de Prácticas</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Pulsa sobre cualquier clase para abrir su Ficha Técnica o gestionar su estado</p>
                </div>

                <!-- Leyenda de colores acordada para el Alumno -->
                <div class="flex flex-wrap items-center gap-2 sm:gap-3 text-xs">
                    <span class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-amber-500/10 text-amber-500 font-semibold border border-amber-500/30">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                    <span>Clase Pendiente</span>
                    </span>
                    <span class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-500 font-semibold border border-emerald-500/30">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                    <span>Clase Recibida</span>
                    </span>
                    <span class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-slate-500/10 text-slate-400 font-semibold border border-slate-500/30">
                        <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                    <span>Clase Cancelada</span>
                    </span>
                    <span class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-purple-500/10 text-purple-400 font-semibold border border-purple-500/30">
                        <span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span>
                    <span>Examen Oficial DGT</span>
                    </span>
                </div>
            </div>

            <!-- Contenedor Cuadrícula Semanal Nativa (SSR + HTMX) -->
            <div id="contenedor-cuadricula-calendario" th:replace="~{alumno/fragments/cuadricula-calendario :: cuadriculaSemanal}"></div>

        </main>
    </div>

    <!-- Contenedor dinámico HTMX para modales -->
    <div id="contenedor-modal"></div>

</body>

</html>
