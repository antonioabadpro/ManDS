<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Clases Prácticas - ManDS</title>

    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Prevención de FOUC para Tema Oscuro -->
    <script>
        if (localStorage.getItem('mands_theme') === 'dark' || (!('mands_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <link rel="stylesheet" href="../../static/css/styles.css" th:href="@{/css/styles.css}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../static/js/tailwind-config.js" th:src="@{/js/tailwind-config.js}"></script>

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="../../static/js/htmx-config.js" th:src="@{/js/htmx-config.js}"></script>

    <script src="../../static/js/layout.js" th:src="@{/js/layout.js}" defer></script>
    <script src="../../static/js/alumno.js" th:src="@{/js/alumno.js}" defer></script>
</head>

<body class="min-h-screen bg-slate-100 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-100 antialiased selection:bg-indigo-600 selection:text-white flex flex-col lg:flex-row overflow-x-hidden">

    <div id="sidebar-backdrop" class="fixed inset-0 z-40 bg-slate-950/60 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-none hidden lg:hidden" aria-hidden="true"></div>

    <aside th:replace="~{alumno/fragments/alumno-nav :: sidebar(activeSection='calendario')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-slate-50 dark:bg-slate-950 min-h-screen">

        <header th:replace="~{alumno/fragments/alumno-nav :: topbar(tituloSeccion='Reservar Clases Prácticas', subtituloSeccion='Agenda interactiva de tu profesor asignado y reserva de sesiones')}"></header>

        <main class="flex-1 p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl mx-auto w-full">

            <!-- Mensajes Flash y Alertas Dinámicas HTMX -->
            <div id="contenedor-alertas">
                <div th:if="${mensajeExito}" class="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 flex items-start space-x-3 text-emerald-800 dark:text-emerald-200 shadow-sm animate-fade-in">
                    <svg class="w-5 h-5 shrink-0 text-emerald-600 dark:text-emerald-400 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <div class="flex-1 text-xs sm:text-sm font-medium" th:text="${mensajeExito}"></div>
                </div>

                <div th:if="${error}" class="p-4 rounded-2xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 flex items-start space-x-2 text-rose-800 dark:text-rose-200 shadow-sm text-xs sm:text-sm animate-fade-in">
                    <svg class="w-4 h-4 shrink-0 text-rose-600 dark:text-rose-400 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <div class="flex-1 font-medium" th:text="${error}"></div>
                </div>
            </div>

            <!-- Cabecera Unificada: Calendario de Prácticas, Capacidad de Reserva y Acciones -->
            <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-4">
                <!-- Fila Principal: Título, Botón Leyenda, Capacidad, Profesor Asignado y Botón de Saldo -->
                <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                    <div class="space-y-1">
                        <div class="flex items-center gap-2.5 flex-wrap">
                            <h2 class="text-xl font-bold text-slate-900 dark:text-white">Calendario de Prácticas</h2>
                            <!-- Botón Plegable de Leyenda Integrado en la Cabecera -->
                            <button id="btn-toggle-leyenda" type="button" class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-xl bg-slate-100 hover:bg-slate-200/80 dark:bg-slate-800/80 dark:hover:bg-slate-700/80 text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700/80 transition-all text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer select-none" aria-expanded="false" aria-controls="fila-leyenda-desplegable" title="Mostrar u ocultar leyenda de estados">
                                <svg class="w-4 h-4 text-indigo-600 dark:text-indigo-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <path d="M12 16v-4"></path>
                                    <path d="M12 8h.01"></path>
                                </svg>
                                <span>Leyenda</span>
                                <svg id="chevron-leyenda" class="w-3.5 h-3.5 text-slate-400 dark:text-slate-500 transition-transform duration-200 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                                </svg>
                            </button>
                        </div>
                        <p th:replace="~{alumno/fragments/indicador-capacidad :: indicadorCapacidad(esOob=false)}"></p>
                    </div>

                    <!-- Bloque de Profesor Asignado y Enlace a Compra de Saldo / Matrícula -->
                    <div class="flex flex-wrap sm:flex-nowrap items-center gap-3 shrink-0">
                        <!-- Chip con Nombre Completo del Profesor Asignado -->
                        <div class="inline-flex items-center space-x-2 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/80 text-xs">
                            <svg class="w-4 h-4 text-indigo-600 dark:text-indigo-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                            <div class="flex items-center space-x-1.5">
                                <span class="text-slate-500 dark:text-slate-400 font-medium">Profesor:</span>
                                <span class="font-bold text-slate-900 dark:text-white" th:text="${profesor != null ? (profesor.nombre + ' ' + profesor.apellidos) : 'Sin profesor asignado'}">Sin profesor asignado</span>
                            </div>
                        </div>

                        <!-- Botón Comprar Saldo o Matricularme -->
                        <th:block th:if="${matricula != null}">
                            <a th:href="@{/alumno/pagos}" class="inline-flex items-center space-x-2 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md transition transform active:scale-95">
                                <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                                </svg>
                                <span>Comprar Saldo</span>
                            </a>
                        </th:block>
                        <a th:if="${matricula == null}" th:href="@{/alumno/dashboard#seccion-nueva-matricula}" class="inline-flex items-center space-x-2 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-md transition transform active:scale-95">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                            <span>Matricularme en un Permiso</span>
                        </a>
                    </div>
                </div>

                <!-- Fila Inferior Plegable: Desaparece completamente cuando la leyenda está oculta para ahorrar espacio -->
                <div id="fila-leyenda-desplegable" class="pt-3 border-t border-slate-100 dark:border-slate-800/80 hidden transition-all duration-200">
                    <div class="flex flex-wrap lg:flex-nowrap items-center gap-2 sm:gap-2.5 justify-start lg:justify-between text-[11px]">
                        <span class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-lg bg-amber-500/10 text-amber-600 dark:text-amber-400 font-medium border border-amber-500/20">
                            <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                            <span>Clase Pendiente</span>
                        </span>
                        <span class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-medium border border-emerald-500/20">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                            <span>Clase Recibida</span>
                        </span>
                        <span class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-lg bg-slate-500/10 text-slate-600 dark:text-slate-400 font-medium border border-slate-500/20">
                            <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                            <span>Horario Ocupado</span>
                        </span>
                        <span class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-lg bg-rose-500/10 text-rose-600 dark:text-rose-400 font-medium border border-rose-500/20">
                            <span class="w-2 h-2 rounded-full bg-rose-500"></span>
                            <span>Clase Cancelada</span>
                        </span>
                        <span class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-lg bg-purple-500/10 text-purple-600 dark:text-purple-400 font-medium border border-purple-500/20">
                            <span class="w-2 h-2 rounded-full bg-purple-500"></span>
                            <span>Examen Oficial DGT</span>
                        </span>
                        <span class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-lg bg-slate-500/10 text-slate-600 dark:text-slate-400 font-medium border border-slate-500/20">
                            <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                            <span>Festivo / Vacaciones</span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Contenedor Cuadrícula Semanal Nativa (SSR + HTMX) -->
            <div id="contenedor-cuadricula-calendario" th:replace="~{alumno/fragments/cuadricula-calendario :: cuadriculaSemanal}"></div>

        </main>
    </div>

    <!-- Contenedor dinámico HTMX para modales -->
    <div id="contenedor-modal"></div>

</body>

</html>
