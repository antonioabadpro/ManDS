<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Clases Prácticas - ManDS</title>

    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Prevención de FOUC para Tema Oscuro -->
    <script>
        if (localStorage.getItem('mands_theme') === 'dark' || (!('mands_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <link rel="stylesheet" href="../../static/css/styles.css" th:href="@{/css/styles.css}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../static/js/tailwind-config.js" th:src="@{/js/tailwind-config.js}"></script>

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="../../static/js/htmx-config.js" th:src="@{/js/htmx-config.js}"></script>

    <!-- FullCalendar v6 CDN Oficial -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <script src="../../static/js/layout.js" th:src="@{/js/layout.js}" defer></script>
    <script src="../../static/js/alumno.js" th:src="@{/js/alumno.js}" defer></script>
</head>

<body class="min-h-screen bg-slate-100 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-100 antialiased selection:bg-indigo-600 selection:text-white flex flex-col lg:flex-row overflow-x-hidden">

    <div id="sidebar-backdrop" class="fixed inset-0 z-40 bg-slate-950/60 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-none hidden lg:hidden" aria-hidden="true"></div>

    <aside th:replace="~{fragments/alumno-nav :: sidebar(activeSection='calendario')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-slate-50 dark:bg-slate-950 min-h-screen">

        <header th:replace="~{fragments/alumno-nav :: topbar(tituloSeccion='Reservar Clases Prácticas', subtituloSeccion='Agenda interactiva de tu profesor asignado y reserva de sesiones')}"></header>

        <main class="flex-1 p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl mx-auto w-full">

            <!-- Mensajes Flash y Alertas Dinámicas HTMX -->
            <div id="contenedor-alertas">

            </div>

            <!-- Banner de Control de Capacidad y Regla de Negocio 7.4 -->
            <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="space-y-1">
                    <div class="flex items-center space-x-2">
                        <h2 class="text-xl font-bold text-slate-900 dark:text-white">Agenda de Prácticas</h2>
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-indigo-100 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800" th:text="${profesor != null ? 'Prof. ' + profesor.nombre : 'Sin Profesor'}">
                            Prof. Asignado
                        </span>
                    </div>
                    <p th:replace="~{alumno/fragments/indicador-capacidad :: indicadorCapacidad(esOob=false)}"></p>
                </div>

                <!-- Botón de Nueva Reserva con HTMX o Enlace a Nueva Matrícula -->
                <div class="flex items-center gap-3 shrink-0">
                    <th:block th:if="${matricula != null}">
                        <button type="button" hx-get="/alumno/clases/reservar-modal" hx-target="#contenedor-modal" hx-swap="innerHTML" class="inline-flex items-center space-x-2 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md transition transform active:scale-95">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                            <span>Nueva Reserva</span>
                        </button>
                        <a th:href="@{/alumno/pagos}" class="inline-flex items-center space-x-1.5 px-3.5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold transition">
                            <span>Comprar Saldo</span>
                        </a>
                    </th:block>
                    <a th:if="${matricula == null}" th:href="@{/alumno/dashboard#seccion-nueva-matricula}" class="inline-flex items-center space-x-2 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-md transition transform active:scale-95">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        <span>Matricularme en un Permiso</span>
                    </a>
                </div>
            </div>

            <!-- Leyenda de colores acordada para el Alumno -->
            <div class="flex flex-wrap items-center gap-2 sm:gap-4 p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm text-xs">
                <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mr-1">Leyenda:</span>
                <span class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-amber-100 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 font-semibold border border-amber-200 dark:border-amber-800">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                <span>Tu Clase Pendiente</span>
                </span>
                <span class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-emerald-100 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-300 font-semibold border border-emerald-200 dark:border-emerald-800">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                <span>Tu Clase Recibida</span>
                </span>
                <span class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-medium border border-slate-200 dark:border-slate-700">
                    <span class="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
                <span>Tu Clase Cancelada</span>
                </span>
                <span class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-slate-200/70 dark:bg-slate-800/80 text-slate-500 dark:text-slate-400 font-medium border border-slate-300 dark:border-slate-700">
                    <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                <span>Ocupado / No Disponible</span>
                </span>
            </div>

            <!-- Contenedor FullCalendar v6 -->
            <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm p-4 sm:p-6 overflow-hidden">
                <div id="calendario-alumno" class="text-xs sm:text-sm"></div>
            </div>

        </main>
    </div>

    <!-- Contenedor dinámico HTMX para modales -->
    <div id="contenedor-modal"></div>

</body>

</html>
