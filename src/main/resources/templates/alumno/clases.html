<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Clases Prácticas - ManDS</title>

    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Prevención de FOUC para Tema Oscuro -->
    <script>
        if (localStorage.getItem('mands_theme') === 'dark' || (!('mands_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <link rel="stylesheet" href="../../static/css/styles.css" th:href="@{/css/styles.css}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../static/js/tailwind-config.js" th:src="@{/js/tailwind-config.js}"></script>

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="../../static/js/htmx-config.js" th:src="@{/js/htmx-config.js}"></script>

    <script src="../../static/js/layout.js" th:src="@{/js/layout.js}" defer></script>
    <script src="../../static/js/alumno.js" th:src="@{/js/alumno.js}" defer></script>
</head>

<body class="min-h-screen bg-slate-100 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-100 antialiased selection:bg-indigo-600 selection:text-white flex flex-col lg:flex-row overflow-x-hidden">

    <div id="sidebar-backdrop" class="fixed inset-0 z-40 bg-slate-950/60 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-none hidden lg:hidden" aria-hidden="true"></div>

    <aside th:replace="~{fragments/alumno-nav :: sidebar(activeSection='clases')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-slate-50 dark:bg-slate-950 min-h-screen">

        <header th:replace="~{fragments/alumno-nav :: topbar(tituloSeccion='Historial de Clases Prácticas', subtituloSeccion='Registro pormenorizado de prácticas, kilometraje y notas pedagógicas')}"></header>

        <main class="flex-1 p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl mx-auto w-full">

            <!-- Mensajes Flash y Alertas -->
            <div id="contenedor-alertas">
                <div th:if="${mensajeExito}" class="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 flex items-start space-x-3 text-emerald-800 dark:text-emerald-200">
                    <svg class="w-5 h-5 shrink-0 text-emerald-600 dark:text-emerald-400 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <div class="flex-1 text-xs sm:text-sm font-medium" th:text="${mensajeExito}"></div>
                </div>

                <div th:if="${error}" class="p-4 rounded-2xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 flex items-start space-x-3 text-rose-800 dark:text-rose-200">
                    <svg class="w-5 h-5 shrink-0 text-rose-600 dark:text-rose-400 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <div class="flex-1 text-xs sm:text-sm font-medium" th:text="${error}"></div>
                </div>
            </div>

            <!-- Cabecera de la Sección y Búsqueda -->
            <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 dark:text-white">Mis Clases Prácticas</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Total de clases computadas: <span class="font-bold text-slate-800 dark:text-slate-200" th:text="${totalClases ?: 0}">0</span></p>
                </div>

                <div class="w-full md:w-72 relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </span>
                    <input type="text" data-table-search="tabla-historial-clases" placeholder="Buscar por fecha, profesor o lugar..." class="w-full pl-9 pr-3 py-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>
            </div>

            <!-- Tabla de Historial de Clases -->
            <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table id="tabla-historial-clases" class="w-full text-left text-xs text-slate-600 dark:text-slate-300">
                        <thead class="bg-slate-50 dark:bg-slate-800/80 text-slate-400 uppercase font-semibold text-[10px] tracking-wider border-b border-slate-100 dark:border-slate-800">
                            <tr>
                                <th class="py-3 px-4">Fecha y Hora</th>
                                <th class="py-3 px-4">Duración</th>
                                <th class="py-3 px-4">Profesor</th>
                                <th class="py-3 px-4">Recogida</th>
                                <th class="py-3 px-4">Estado</th>
                                <th class="py-3 px-4">Recorrido</th>
                                <th class="py-3 px-4 text-right">Ficha Técnica</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                            <tr th:each="c : ${clases}" class="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition">
                                <td class="py-3.5 px-4 font-mono font-semibold text-slate-900 dark:text-white" th:text="${#temporals.format(c.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
                                <td class="py-3.5 px-4" th:text="${c.duracion} + ' min'">45 min</td>
                                <td class="py-3.5 px-4 font-medium text-slate-800 dark:text-slate-200" th:text="${c.profesor?.nombre + ' ' + c.profesor?.apellidos} ?: 'No asignado'"></td>
                                <td class="py-3.5 px-4 truncate max-w-[180px]" th:text="${c.puntoRecogida}"></td>
                                <td class="py-3.5 px-4">
                                    <span th:if="${c.estadoClase.name() == 'PENDIENTE'}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 dark:bg-amber-950/40 dark:text-amber-300 border border-amber-200 dark:border-amber-800">
                                        PENDIENTE
                                    </span>
                                    <span th:if="${c.estadoClase.name() == 'RECIBIDA'}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/40 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">
                                        RECIBIDA
                                    </span>
                                    <span th:if="${c.estadoClase.name() == 'CANCELADA'}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-400 border border-slate-200 dark:border-slate-700">
                                        CANCELADA
                                    </span>
                                </td>
                                <td class="py-3.5 px-4 font-mono">
                                    <span th:if="${c.estadoClase.name() == 'RECIBIDA'}" th:text="${(c.kmFin ?: 0) - (c.kmInicio ?: 0)} + ' km'"></span>
                                    <span th:if="${c.estadoClase.name() != 'RECIBIDA'}" class="text-slate-400">--</span>
                                </td>
                                <td class="py-3.5 px-4 text-right">
                                    <button type="button" th:attr="hx-get=@{/alumno/clases/{id}/modal(id=${c.id})}" hx-target="#contenedor-modal" hx-swap="innerHTML" class="inline-flex items-center space-x-1 px-3 py-1.5 rounded-xl text-xs font-semibold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 dark:bg-indigo-950/40 dark:text-indigo-300 transition">
                                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                        </svg>
                                        <span>Ver Detalle</span>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${clases == null or #lists.isEmpty(clases)}">
                                <td colspan="7" class="py-12 text-center text-slate-400 italic">
                                    No se han encontrado clases prácticas en tu expediente.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Contenedor dinámico HTMX para modales -->
    <div id="contenedor-modal"></div>

</body>

</html>
