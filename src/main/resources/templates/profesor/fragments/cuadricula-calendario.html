<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Fragmento Cuadrícula Semanal del Profesor (SSR + HTMX) -->
<div id="contenedor-cuadricula-calendario" th:fragment="cuadriculaSemanal" class="space-y-4">

    <!-- Cabecera de Navegación Semanal -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pb-2">
        <!-- Controles Prev / Next / Hoy -->
        <div class="inline-flex items-center space-x-1 rounded-xl bg-slate-100 dark:bg-slate-800/80 p-1 border border-slate-200 dark:border-slate-700/80 shrink-0">
            <button type="button" th:attr="hx-get=@{/profesor/calendario/cuadricula(fechaRef=${calendarioSemanal.semanaAnterior})}" hx-target="#contenedor-cuadricula-calendario" hx-swap="outerHTML" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 transition" title="Semana anterior">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <button type="button" th:attr="hx-get=@{/profesor/calendario/cuadricula(fechaRef=${calendarioSemanal.semanaSiguiente})}" hx-target="#contenedor-cuadricula-calendario" hx-swap="outerHTML" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 transition" title="Semana siguiente">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
            <button type="button" th:attr="hx-get=@{/profesor/calendario/cuadricula(fechaRef=${calendarioSemanal.hoy})}" hx-target="#contenedor-cuadricula-calendario" hx-swap="outerHTML" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-white dark:hover:bg-slate-700 transition">
                Hoy
            </button>
        </div>

        <!-- Rango Semanal Visible -->
        <div class="text-base sm:text-lg font-bold text-slate-900 dark:text-white tracking-tight" th:text="${calendarioSemanal.rangoFechasTexto}">
            5 – 9 oct 2026
        </div>

        <!-- Indicador de Turno Oficial -->
        <div class="flex items-center space-x-2 shrink-0">
            <span class="px-2.5 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider bg-violet-100 dark:bg-violet-950/40 text-violet-700 dark:text-violet-300 border border-violet-200 dark:border-violet-800" th:text="${'Turno: ' + calendarioSemanal.turno.name()}">
                Turno: MATINAL
            </span>
        </div>
    </div>

    <!-- Cuadrícula Semanal Responsiva -->
    <div class="overflow-x-auto rounded-2xl border border-slate-200/80 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm">
        <table class="w-full border-collapse text-left text-xs sm:text-sm">
            <!-- Encabezado de Columnas (Jornada y Días Lun-Vie) -->
            <thead>
                <tr class="border-b border-slate-200 dark:border-slate-800 bg-slate-50/80 dark:bg-slate-950/50 text-slate-700 dark:text-slate-300">
                    <th class="p-3 font-semibold text-center w-24 sm:w-28 min-w-[5.5rem] border-r border-slate-200 dark:border-slate-800">
                        Jornada
                    </th>
                    <th th:each="dia : ${calendarioSemanal.dias}" class="p-3 font-semibold text-center min-w-[10rem] border-r last:border-r-0 border-slate-200 dark:border-slate-800" th:classappend="${dia.esHoy ? 'bg-violet-50/50 dark:bg-violet-950/20 text-violet-700 dark:text-violet-300 font-bold' : ''}">
                        <div class="flex flex-col items-center justify-center">
                            <span class="capitalize" th:text="${dia.encabezadoCompleto}">lun 5/10</span>
                            <span th:if="${dia.esExamenDgt}" class="mt-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-purple-100 dark:bg-purple-950/60 text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-purple-800">
                                Examen DGT
                            </span>
                        </div>
                    </th>
                </tr>
            </thead>

            <!-- Filas con los 9 tramos de 45 minutos -->
            <tbody class="divide-y divide-slate-200 dark:divide-slate-800">
                <tr th:each="fila : ${calendarioSemanal.filas}">
                    <!-- Columna de Hora -->
                    <td class="p-2 sm:p-3 text-center bg-slate-50/50 dark:bg-slate-950/30 border-r border-slate-200 dark:border-slate-800 align-middle">
                        <span class="block text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200" th:text="${fila.tramo.etiqueta}">08:00</span>
                        <span class="block text-[10px] text-slate-400 dark:text-slate-500 font-mono" th:text="${fila.tramo.etiquetaCompleta}">08:00 - 08:45</span>
                    </td>

                    <!-- Celdas para cada día de la semana -->
                    <td th:each="celda : ${fila.celdas}" class="p-1 sm:p-1.5 border-r last:border-r-0 border-slate-200 dark:border-slate-800 align-middle h-20 min-h-[5rem]">

                        <!-- 1. Celda en día de Examen Oficial DGT -->
                        <div th:if="${celda.esExamenDgt}" class="w-full h-full min-h-[4.25rem] rounded-xl p-2 bg-purple-500/10 dark:bg-purple-950/30 border border-purple-500/30 flex flex-col justify-between items-center text-center shadow-xs">
                            <div class="flex items-center space-x-1.5">
                                <span class="w-2 h-2 rounded-full bg-purple-500 shrink-0"></span>
                                <span class="text-[11px] font-bold text-purple-800 dark:text-purple-200">Examen Oficial DGT</span>
                            </div>
                            <span class="text-[10px] font-medium text-purple-600 dark:text-purple-400">Jornada Completa</span>
                        </div>

                        <!-- 2. Celda Ocupada por Clase Práctica -->
                        <div th:if="${!celda.esExamenDgt and celda.ocupada}" class="w-full h-full">
                            <!-- Botón/Tarjeta contenida dentro de la celda -->
                            <button type="button" th:attr="hx-get=${celda.modalUrl}" hx-target="#contenedor-modal" hx-swap="innerHTML" class="w-full h-full min-h-[4.25rem] text-left p-2 rounded-xl border shadow-xs transition transform hover:scale-[1.01] active:scale-[0.99] flex flex-col justify-between cursor-pointer" th:classappend="${celda.estado == 'RECIBIDA' ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-800/80 text-emerald-900 dark:text-emerald-100 hover:border-emerald-300' : (celda.estado == 'CANCELADA' ? 'bg-slate-100 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:border-slate-300' : 'bg-amber-50 dark:bg-amber-950/40 border-amber-200 dark:border-amber-800/80 text-amber-900 dark:text-amber-100 hover:border-amber-300')}">

                                <div class="flex items-center justify-between w-full">
                                    <div class="flex items-center space-x-1.5">
                                        <span class="w-2 h-2 rounded-full shrink-0" th:classappend="${celda.estado == 'RECIBIDA' ? 'bg-emerald-500' : (celda.estado == 'CANCELADA' ? 'bg-slate-400' : 'bg-amber-500')}"></span>
                                        <span class="text-[10px] font-semibold uppercase tracking-wider" th:text="${celda.subtitulo}">Pendiente</span>
                                    </div>
                                    <span class="text-[9px] font-mono opacity-70" th:text="${fila.tramo.etiqueta}">08:00</span>
                                </div>

                                <div class="mt-1">
                                    <span class="text-xs font-bold truncate block" th:text="${celda.titulo}">Nombre Alumno</span>
                                </div>

                                <div class="text-[9px] opacity-75 text-right font-medium">
                                    Ver Ficha &rarr;
                                </div>
                            </button>
                        </div>

                        <!-- 3. Celda Libre -->
                        <div th:if="${!celda.esExamenDgt and !celda.ocupada}" class="w-full h-full min-h-[4.25rem] rounded-xl border border-dashed border-slate-200 dark:border-slate-800/80 flex items-center justify-center text-slate-400 dark:text-slate-600 text-xs">
                            <span class="opacity-70">Libre</span>
                        </div>

                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

</html>
