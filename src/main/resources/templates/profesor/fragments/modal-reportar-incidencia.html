<div id="modal-reportar-incidencia" th:fragment="modal-reportar-incidencia" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-reportar-incidencia" th:classappend="${abrirModalReportarIncidencia} ? 'flex' : 'hidden'" class="fixed inset-0 z-50 items-center justify-center p-3 sm:p-4 overflow-y-auto">
    <div class="modal-backdrop fixed inset-0 bg-slate-950/70 backdrop-blur-sm transition-opacity cursor-pointer" data-modal-close="modal-reportar-incidencia"></div>

    <div class="relative w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-5 my-auto z-10 animate-fade-in">
        <!-- Cabecera del Modal -->
        <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-4">
            <div class="space-y-0.5">
                <div class="flex items-center space-x-2">
                    <span class="w-8 h-8 rounded-xl bg-amber-500/10 text-amber-600 dark:text-amber-400 flex items-center justify-center shrink-0">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                    </span>
                    <h3 id="titulo-modal-reportar-incidencia" class="text-base sm:text-lg font-bold text-slate-900 dark:text-white">
                        Reportar Incidencia Mecánica
                    </h3>
                </div>
                <p class="text-xs text-slate-500 dark:text-slate-400">Aviso técnico directo a la administración del centro</p>
            </div>
            <button type="button" data-modal-close="modal-reportar-incidencia" class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer" aria-label="Cerrar modal">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Alerta de Error de Validación o Negocio -->
        <div th:if="${errorReportarIncidencia}" class="p-3.5 rounded-2xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-xs flex items-center space-x-2.5">
            <svg class="w-4 h-4 shrink-0 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span th:text="${errorReportarIncidencia}">Error al registrar la incidencia mecánica.</span>
        </div>

        <!-- Formulario HTMX para Envío Asíncrono de Reporte -->
        <form id="form-reportar-incidencia" th:action="@{/profesor/vehiculo/incidencia}" th:attr="hx-post=@{/profesor/vehiculo/incidencia}" hx-target="#contenedor-modal-reportar-incidencia" hx-swap="innerHTML" hx-disabled-elt="#btn-submit-reportar-incidencia" method="post" class="space-y-4">
            <input type="hidden" name="vehiculoId" th:value="${vehiculo?.id}" />

            <!-- Tarjeta Informativa del Vehículo Asignado -->
            <div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-800 text-xs">
                <span class="text-slate-400 block text-[11px]">Vehículo Afectado:</span>
                <span class="font-bold text-slate-900 dark:text-white" th:text="${vehiculo != null ? vehiculo.marca + ' ' + vehiculo.modelo + ' (' + vehiculo.matricula + ')' : 'Sin vehículo asignado'}">
                    SEAT Ibiza 1.0 TSI (1234-LMN)
                </span>
            </div>

            <!-- Campo Descripción de la Avería -->
            <div>
                <label for="incidencia-descripcion" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Descripción de la Avería o Anomalía <span class="text-rose-500 font-bold">*</span>
                </label>
                <textarea id="incidencia-descripcion" name="descripcion" rows="4" required minlength="10" maxlength="1000" class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500 resize-none transition" placeholder="Describe los síntomas observados: ruidos anómalos, fallo de testigos en salpicadero, pérdida de líquido refrigerante, presión de neumáticos, etc..."></textarea>
                <p class="text-[11px] text-slate-400 dark:text-slate-500 mt-1">Mínimo 10 caracteres. El Administrador recibirá una notificación por correo con este detalle.</p>
            </div>

            <!-- Botones de Acción y Feedback de Carga con Animate-Spin -->
            <div class="flex items-center justify-end space-x-3 pt-2 border-t border-slate-100 dark:border-slate-800">
                <button type="button" data-modal-close="modal-reportar-incidencia" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer">
                    Cancelar
                </button>
                <button id="btn-submit-reportar-incidencia" type="submit" class="px-5 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 active:bg-amber-800 disabled:opacity-60 disabled:cursor-not-allowed text-white text-xs font-bold shadow-md shadow-amber-600/20 transition cursor-pointer flex items-center space-x-2 shrink-0">
                    <span class="htmx-indicator-none">Enviar Reporte</span>

                    <!-- Spinner animado y texto reactivo de carga durante la petición HTMX -->
                    <svg class="w-4 h-4 animate-spin htmx-indicator" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                    </svg>
                    <span class="htmx-indicator">Enviando reporte...</span>
                </button>
            </div>
        </form>
    </div>
</div>
