# ==================================================
# BASE DE DATOS AISLADA PARA PRUEBAS (H2 EN MEMORIA)
# ==================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# URL base para enlaces de prueba
app_base_url=http://localhost:8080

# Configuración simulada de Stripe para tests
stripe.api.key=sk_test_dummy_key_for_testing
stripe.public.key=pk_test_dummy_key_for_testing
stripe.webhook.secret=whsec_dummy_secret_for_testing